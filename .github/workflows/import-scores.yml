name: Import WC2026 Scores

on:
  push:
    branches: [main]      # run immediately on every deploy
  schedule:
    - cron: '*/5 * * * *' # every 5 minutes (GitHub minimum)
  workflow_dispatch:       # manual trigger from Actions tab

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --prefix scripts firebase-admin

      - name: Import scores from ESPN → Firebase
        run: node scripts/import-scores.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
